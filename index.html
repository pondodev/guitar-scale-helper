<!DOCTYPE html>
<html>
<head>
    <title>guitar scale helper</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Allerta&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="index.css" />
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="index.js"></script>
</head>

<body>
    <h1>guitar scale helper</h1>

    <form>
        <label for="string_count">string count:</label>
        <input type="text" name="string_count" id="string_count" value="6" />

        <label for="fret_count">fret count:</label>
        <input type="text" name="fret_count" id="fret_count" value="20" />

        <label for="root_select">root:</label>
        <select name="root_select" id="root_select">
            <option value="A">A</option>
            <option value="A#">A#</option>
            <option value="B">B</option>
            <option value="C">C</option>
            <option value="C#">C#</option>
            <option value="D">D</option>
            <option value="D#">D#</option>
            <option value="E">E</option>
            <option value="F">F</option>
            <option value="F#">F#</option>
            <option value="G">G</option>
            <option value="G#">G#</option>
        </select>

        <!-- TODO: add more scales from https://pulse.berklee.edu/scales/index.html -->
        <label for="scale_select">scale:</label>
        <select name="scale_select" id="scale_select">
            <option value="major">major</option>
            <option value="natural minor">natural minor</option>
            <option value="harmonic minor">harmonic minor</option>
            <option value="major pentatonic">major pentatonic</option>
            <option value="minor pentatonic">minor pentatonic</option>
            <option value="major blues">major blues</option>
            <option value="minor blues">minor blues</option>
        </select>
    </form>

    <div id="chart">
        <h2 id="chart_title"></h2>

        <table id="chart_display">
        </table>
    </div>
</body>
</html>
